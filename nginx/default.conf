# Docker'ning ichki DNS resolver - upstream nomlarini dinamik yangilaydi
resolver 127.0.0.11 valid=30s ipv6=off;

upstream django {
    server inspectpro_django:8000;
    keepalive 16;
}

upstream flower {
    server inspectpro_flower:5555;
}

log_format json_combined escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$proxy_add_x_forwarded_for",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream":"$upstream_addr"'
  '}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json_combined;
    client_max_body_size 100M;

    # ── Health check ──────────────────────────────────────────
    location ~ ^/(health|api/v1/health)/ {
        proxy_pass http://django;
        access_log off;
    }

    # ── Django Admin ──────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── API Schema / Swagger ──────────────────────────────────
    location ~ ^/(schema|swagger|redoc)/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Flower (Celery monitoring) ────────────────────────────
    location /flower/ {
        proxy_pass         http://flower/flower/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # ── Static files ──────────────────────────────────────────
    location /static/ {
        alias   /usr/src/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ───────────────────────────────────────────
    location /media/ {
        alias   /usr/src/app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Deny everything else ──────────────────────────────────
    location / {
        return 404;
    }
}
