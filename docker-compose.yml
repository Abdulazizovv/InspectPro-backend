name: inspectpro-backend

# Network design:
#   internal_net (internal: true) — DB va Redis uchun, internet YO'Q
#   app_net      (bridge)         — Django, Celery, Nginx uchun, internet BOR
#
# DB va Redis: faqat internal_net  → host'dan ko'rinmaydi, internetga chiqa olmaydi
# Django/Celery: internal_net + app_net → DB/Redis-ga kiradi VA internetga chiqadi
# Nginx: faqat app_net → Django/Flower-ga kiradi, faqat 8080 porti ochiq

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  inspectpro_db:
    image: postgres:16.13-alpine3.23
    container_name: inspectpro_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    tmpfs:
      - /tmp
      - /var/run/postgresql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ───────────────────────────────────────────────────────────────────
  inspectpro_redis:
    image: redis:7.4.7-alpine3.21
    container_name: inspectpro_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Django ──────────────────────────────────────────────────────────────────
  inspectpro_django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectpro_django
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - logs_volume:/usr/src/app/logs
    expose:
      - "8000"
    depends_on:
      inspectpro_db:
        condition: service_healthy
      inspectpro_redis:
        condition: service_healthy
    networks:
      - internal_net
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  inspectpro_celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectpro_celery
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_volume:/usr/src/app/media
      - logs_volume:/usr/src/app/logs
    entrypoint: []
    command: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      inspectpro_db:
        condition: service_healthy
      inspectpro_redis:
        condition: service_healthy
    networks:
      - internal_net
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  inspectpro_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectpro_celery_beat
    restart: unless-stopped
    env_file: .env
    volumes:
      - celery_beat_data:/usr/src/app/celerybeat
      - logs_volume:/usr/src/app/logs
    entrypoint: []
    command: ["celery", "-A", "core", "beat", "-l", "info", "--schedule=/usr/src/app/celerybeat/celerybeat-schedule"]
    depends_on:
      inspectpro_db:
        condition: service_healthy
      inspectpro_redis:
        condition: service_healthy
    networks:
      - internal_net
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Flower (Celery Monitoring) ──────────────────────────────────────────────
  inspectpro_flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectpro_flower
    restart: unless-stopped
    env_file: .env
    volumes:
      - logs_volume:/usr/src/app/logs
    entrypoint: []
    command: >
      celery -A core flower
      --address=0.0.0.0
      --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH:-admin:admin}
      --url_prefix=flower
    depends_on:
      - inspectpro_redis
      - inspectpro_celery
    expose:
      - "5555"
    networks:
      - internal_net
      - app_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Nginx ───────────────────────────────────────────────────────────────────
  # Yagona tashqi kirish nuqtasi — faqat shu port host'ga ochiq
  inspectpro_nginx:
    image: nginx:1.26-alpine
    container_name: inspectpro_nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/src/app/staticfiles:ro
      - media_volume:/usr/src/app/media:ro
    depends_on:
      - inspectpro_django
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal_net:
    driver: bridge
    internal: true   # DB/Redis: internet YO'Q, faqat ichki aloqa
  app_net:
    driver: bridge   # Django/Celery/Nginx: internet BOR

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  celery_beat_data:
  logs_volume:
